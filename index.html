<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#203c17">
    <title>spamda.net</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Avenir Next", Avenir, sans-serif;
        --edge: clamp(0.75rem, 3vmin, 2rem);
        --heading-gap: 1.75rem;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        position: relative;
        isolation: isolate;
        display: grid;
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        padding: var(--edge);
        background: #183612;
      }

      body::before {
        position: fixed;
        z-index: -2;
        inset: -25%;
        content: "";
        background:
          radial-gradient(circle at 18% 20%, #dff05a 0 8%, transparent 28%),
          radial-gradient(circle at 77% 14%, #fff59a 0 7%, transparent 27%),
          radial-gradient(circle at 84% 77%, #315eb4 0 6%, transparent 24%),
          radial-gradient(circle at 62% 60%, #f58278 0 7%, transparent 25%),
          radial-gradient(circle at 20% 76%, #79a91f 0 12%, transparent 34%),
          radial-gradient(circle at 51% 42%, #b8d943 0 17%, transparent 42%),
          linear-gradient(135deg, #123d1d, #527b1d 48%, #1b4a2a);
        filter: blur(70px) saturate(125%);
        animation: cloud-drift 18s ease-in-out infinite alternate;
      }

      body::after {
        position: fixed;
        z-index: -1;
        inset: 0;
        content: "";
        pointer-events: none;
        background:
          linear-gradient(115deg, rgb(255 255 255 / 8%), transparent 35%),
          radial-gradient(circle at center, transparent 35%, rgb(8 23 8 / 42%) 100%);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--heading-gap);
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      h1 {
        flex: none;
        margin: 0;
        padding: 0.3em 0.72em 0.36em;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 999px;
        color: #fffbe7;
        background: linear-gradient(135deg, rgb(24 61 20 / 82%), rgb(21 42 17 / 58%));
        box-shadow:
          0 0.35rem 1.25rem rgb(12 29 9 / 32%),
          inset 0 1px rgb(255 255 255 / 16%);
        font-size: clamp(1.65rem, 4vmin, 3rem);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.065em;
        text-shadow: 0 2px 0 rgb(0 0 0 / 16%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      h1 span {
        color: #ff9b8f;
      }

      figure {
        display: grid;
        flex: 0 1 auto;
        width: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        place-items: center;
      }

      img {
        display: block;
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
        max-width: 100%;
        max-height: 100%;
        border: 1px solid rgb(255 255 255 / 30%);
        border-radius: clamp(0.9rem, 2.4vmin, 1.75rem);
        box-shadow:
          0 1.25rem 3.5rem rgb(10 28 8 / 48%),
          0 0 0 0.35rem rgb(255 255 255 / 7%);
        object-fit: contain;
      }

      @keyframes cloud-drift {
        from {
          transform: translate3d(-2%, -1%, 0) scale(1);
        }

        to {
          transform: translate3d(2%, 1%, 0) scale(1.06);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>spamda<span>.net</span></h1>
      <figure>
        <img src="spamda.jpg" alt="A happy panda eating Spam in a sunlit bamboo forest">
      </figure>
    </main>
  </body>
</html>
